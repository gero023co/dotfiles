<?xml version="1.0" encoding="UTF-8"?>
<touchégg>
  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">3E9FED</property>
    <property name="borderColor">FFFFFF</property>
  </settings>
  <application name="All">
    <!-- Swipe up with 3 fingers: all-windows view (Mission Control style) -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>skippy-xd --expose</command>
        <on>end</on>
      </action>
    </gesture>
    <!-- Swipe down with 3 fingers: show desktop (repeat to restore windows) -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="SHOW_DESKTOP"></action>
    </gesture>
  </application>
</touchégg>
