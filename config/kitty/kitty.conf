# --- Fonts and Typography ---
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9.5

# --- Transparency and Opacity ---
background_opacity         0.78
background_blur            15
dynamic_background_opacity yes

# --- Color Scheme (Inspired by the wallpaper) ---
# A very dark gray-green background with soft, light text
background            #0b1114
foreground            #d2dadf
cursor                #e68a33
cursor_text_color     #0b1114
selection_background  #1f2d35
selection_foreground  #d2dadf
url_color             #53b3cb

# --- Window and Borders ---
window_padding_width  10
hide_window_decorations no
confirm_os_window_close 0

# --- Performance / Memory ---
# 10000 (default) uses hundreds of MB per window on this machine.
scrollback_lines 3000

# --- ANSI Color Palette (Muted Forest & Cyber Amber) ---
# Black
color0  #141b20
color8  #2b3842

# Red (earth/warm tones)
color1  #c35b48
color9  #d96f59

# Green (misty greens)
color2  #608472
color10 #7aa58f

# Yellow (the amber of the lights in the background)
color3  #cf893c
color11 #e6a254

# Blue
color4  #4f8da8
color12 #6ba7c2

# Magenta
color5  #967399
color13 #b38fb6

# Cyan
color6  #4d9ca6
color14 #6ebbc5

# White
color7  #b9c4c9
color15 #dbe6ec
